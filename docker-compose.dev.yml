services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    profiles:
      - pgvector
    environment:
      POSTGRES_DB: semantix
      POSTGRES_USER: semantix
      POSTGRES_PASSWORD: semantix
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U semantix -d semantix
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  redis:
    image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
    profiles:
      - redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    env_file:
      - ./apps/server/.env
    environment:
      DATABASE_MIGRATION_MODE: auto
      TRUSTED_PROXY_CIDRS: "[]"
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "1000"
    volumes:
      - ./apps/server/app:/apps/server/app
      - ./apps/server/tests:/apps/server/tests
      - ./apps/server/scripts:/apps/server/scripts
      - ./packages/cache/src:/packages/cache/src
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /apps/server/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgvector_data:
  redis_data:
