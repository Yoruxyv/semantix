required-version = ">=0.16.3,<0.17"
cache-dir = ".cache/ruff"
extend-exclude = [".cache"]
line-length = 88
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF069"]
preview = true
explicit-preview-rules = true

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
