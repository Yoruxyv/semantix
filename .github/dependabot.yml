version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      github-actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      backend-production-routine:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      backend-development-routine:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      sdk-production-routine:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      sdk-development-routine:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      frontend-production-routine:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-development-routine:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
