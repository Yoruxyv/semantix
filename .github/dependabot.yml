version: 2

# Dependabot policy
# -----------------
# Semantix separates routine dependency maintenance from security remediation.
#
# Routine version updates:
# - Run once per month.
# - Combine supported ecosystems into one cross-ecosystem PR.
# - Include patch and minor releases only.
# - Major upgrades are reviewed and performed deliberately.
#
# Security updates:
# - Are handled independently by Dependabot security updates.
# - Must not wait for the monthly routine-update schedule.
# - Must not be grouped into the routine PR.
# - May update beyond the routine patch/minor policy when required to
#   remediate a vulnerability.
#
# Repository settings must therefore keep:
# - Dependabot alerts: enabled
# - Dependabot security updates: enabled
# - Grouped security updates: disabled
#
# Do not add `applies-to: security-updates` groups here unless the security
# update policy is intentionally changed.

# One scheduled group is shared by every routine ecosystem so eligible
# version updates can be consolidated into a single monthly PR.
multi-ecosystem-groups:
  semantix-routine:
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Etc/UTC

updates:
  # GitHub Actions used by workflows under .github/workflows/.
  #
  # Routine patch/minor updates join the monthly semantix-routine PR.
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Container dependencies referenced from repository-root Docker Compose
  # configuration.
  - package-ecosystem: docker-compose
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Backend container images, including the Python and uv build images.
  - package-ecosystem: docker
    directory: /backend
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Frontend container images, including Node.js and Nginx.
  - package-ecosystem: docker
    directory: /frontend
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Backend Python dependencies.
  #
  # The backend is managed with pyproject.toml + uv.lock, so use Dependabot's
  # native uv ecosystem rather than treating the project as a pip-only project.
  - package-ecosystem: uv
    directory: /backend
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Public Python SDK dependencies.
  #
  # The SDK is also managed with pyproject.toml + uv.lock. Keep its dependency
  # monitoring independent from the backend package contents while sharing the
  # same monthly routine-update PR.
  - package-ecosystem: uv
    directory: /sdk
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Embedded semantic-cache Python dependencies.
  - package-ecosystem: uv
    directory: /embedded
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  # Frontend npm dependencies from package.json/package-lock.json.
  - package-ecosystem: npm
    directory: /frontend
    patterns:
      - "*"
    multi-ecosystem-group: semantix-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor