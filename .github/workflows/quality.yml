  sdk:
    name: Python SDK quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/client
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      AUTH_MODE: token
      AUTH_PRINCIPALS: >-
        [{"name":"sdk-operator","token_sha256":"ccfa50520ce4ed853c9d2e82d8caee8c34ac8c0fd22cfe2d4f387f6006dd194c","role":"operator","namespaces":["normal","read-only","refresh","bypass","private","async"]}]
      CACHE_BACKEND: memory
      EMBEDDING_PROVIDER: mock
      EVALUATION_DATASET_STORAGE: session
      EVALUATION_RUN_HISTORY_STORAGE: disabled
      GENERATION_PROVIDER: mock
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
      RATE_LIMIT: 100/minute
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked SDK dependencies
        run: uv sync --locked --extra dev

      - name: Sync locked backend dependencies
        working-directory: apps/server
        run: uv sync --locked --extra dev --extra redis

      - name: Run SDK Ruff lint
        run: uv run --no-sync ruff check --config ../../ruff.toml --output-format=github .

      - name: Check SDK Ruff formatting
        run: uv run --no-sync ruff format --config ../../ruff.toml --check .

      - name: Run SDK mypy
        run: uv run --no-sync mypy src tests
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python src

      - name: Run SDK unit tests with coverage
        run: uv run --no-sync pytest -m "not integration" --cov=semantix_client

      - name: Check backend OpenAPI contract for SDK routes
        working-directory: apps/server
        run: uv run --no-sync pytest tests/query/api/test_sdk_contract.py

      - name: Run SDK real-HTTP integration tests
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          cd apps/server
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 18081 > /tmp/semantix-sdk-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/health > /dev/null

          cd ../../packages/client
          SEMANTIX_INTEGRATION_URL=http://127.0.0.1:18081 \
            SEMANTIX_INTEGRATION_TOKEN=sdk-operator-token \
            uv run --no-sync python ../../ops/ci/required_tests.py sdk .cache/sdk-integration.xml -- -m integration

      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build

      - name: Check package artifacts
        run: uv run --no-sync python -m twine check dist/*

      - name: Enforce SDK artifact and dependency allowlists
        run: uv run --no-sync python tests/check_artifacts.py

      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/semantix-sdk-smoke"
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -c \
            "from semantix_client import AsyncSemantixClient, CachePolicy, SemantixClient"
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -c \
            "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('semantix', 'app', 'backend', 'fastapi', 'asyncpg', 'numpy', 'pydantic', 'sqlalchemy', 'starlette', 'psycopg'))"

