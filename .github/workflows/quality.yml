        run: docker compose config --quiet

      - name: Validate development Compose file
        run: docker compose -f docker-compose.dev.yml --profile pgvector config --quiet

      - name: Validate hardened Compose file
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Verify development health gates
        shell: bash
        run: bash ops/ci/linux/dev-healthcheck-smoke.sh

  hardened-windows-checkout:
    name: Hardened Windows-checkout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:18080"]'
      COMPOSE_PROJECT_NAME: semantix-eol-${{ github.run_id }}
      POSTGRES_DB: semantix
      POSTGRES_MIGRATION_USER: semantix_migrator
      POSTGRES_RUNTIME_USER: semantix_runtime
      SEMANTIX_BIND_ADDRESS: 127.0.0.1
      SEMANTIX_PORT: "18080"
      MOCK_GENERATION_DELAY_SECONDS: "2"
      RATE_LIMIT: "80/minute"
      TRUSTED_PROXY_CIDRS: '["172.28.0.0/24"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify tracked shell scripts use LF
        run: |
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Create an autocrlf checkout
        shell: bash
        run: |
          git -c core.autocrlf=true clone --quiet --no-local \
            . "$RUNNER_TEMP/semantix-autocrlf"
          cd "$RUNNER_TEMP/semantix-autocrlf"
          git ls-files --eol '*.sh'
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Install browser test dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf/apps/web"
          npm ci

          # Install OS dependencies once. Retrying --with-deps after a timeout
          # can leave apt/dpkg work alive and make the retry fail on its lock.
          npx playwright install-deps chromium

          for attempt in 1 2; do
            if timeout --kill-after=30s 5m \
              npx playwright install chromium; then
              exit 0
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "::error::Playwright browser installation failed twice"
              exit 1
            fi
            echo "::warning::Playwright browser download stalled or failed; retrying once"
            sleep 5
          done

      - name: Run hardened-stack API, browser, axe, and scaling smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf"
          bash ops/ci/linux/hardened-smoke.sh bash -c 'npm --prefix apps/web run test:e2e && python3 ops/ci/two_replica_smoke.py && python3 ops/ci/autoscaling_smoke.py'

      - name: Verify gateway reset resilience
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf"
          python3 ops/ci/gateway_reset_smoke.py

  pgvector:
    name: Platform PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    env:
      PGVECTOR_TEST_DATABASE_URL: "postgresql://semantix:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/semantix"
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: semantix
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_USER: semantix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantix -d semantix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev --extra redis

      - name: Run required PostgreSQL and Redis integration tests
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          if ! uv run --no-sync pytest -m "pgvector or redis" --junitxml=.cache/platform.xml; then
            # Retry only the known timing-sensitive telemetry probes, once.
            uv run --no-sync python - <<'PY'
          from xml.etree.ElementTree import parse
          cases = parse('.cache/platform.xml').findall('.//testcase')
          failures = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          allowed = ('test_pg_telemetry_pool_contention_respects_deadline[',
                     'test_pg_telemetry_sql_timeout_releases_connection_without_counting')
          assert failures and all(
              c.get('classname') == 'tests.cache.infrastructure.backends.test_platform_parity'
              and c.get('name', '').startswith(allowed) for c in failures
          ), 'Unexpected integration failure; no retry'
          assert all(c.find('skipped') is None for c in cases), 'Required platform integration tests skipped'
          PY
            echo "::warning::Telemetry deadline probe failed; retrying failed probes once"
            sleep 2
            docker exec "$POSTGRES_CONTAINER_ID" createdb -U semantix semantix_telemetry_retry
            PGVECTOR_TEST_DATABASE_URL="${PGVECTOR_TEST_DATABASE_URL%/*}/semantix_telemetry_retry" \
              uv run --no-sync pytest tests/cache/infrastructure/backends/test_platform_parity.py -k telemetry --lf --lfnf=none --junitxml=.cache/platform-retry.xml
            uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse('.cache/platform-retry.xml').findall('.//testcase'); assert cases and all(c.find('skipped') is None for c in cases), 'Telemetry retry missing or skipped'"
          fi
          uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse('.cache/platform.xml').findall('.//testcase'); assert cases and all(c.find('skipped') is None for c in cases), 'Required platform integration tests skipped'; names=[c.get('name', '') for c in cases]; assert any('[redis]' in n for n in names) and any('[pgvector]' in n for n in names), 'Official store parity not collected'"

      - name: Exercise pgvector backup and restore
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        working-directory: .
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_dump -U semantix -d semantix -Fc -f /tmp/semantix.dump
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb -U semantix semantix_restore
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore -U semantix -d semantix_restore /tmp/semantix.dump
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql -U semantix -d semantix_restore -Atc \
              "SELECT to_regclass('semantix.cache_entries') IS NOT NULL"
          )" = "t"

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The affected unstable RSC APIs are not used by this client-only SPA.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          fail-on-severity: high

  container-platforms:
    name: Container platforms (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-production
            context: .
            dockerfile: apps/server/Dockerfile
          - name: backend-development
            context: .
            dockerfile: apps/server/Dockerfile.dev
          - name: frontend-production
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: frontend-development
            context: apps/web
            dockerfile: apps/web/Dockerfile.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 and arm64 images
        run: >-
          docker buildx build
          --file "${{ matrix.dockerfile }}"
          --platform linux/amd64,linux/arm64
          --output type=cacheonly
          "${{ matrix.context }}"

  security:
    name: Security checks
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - embedded
      - mysql
      - sqlite-windows
      - sqlite-minimum
      - backend
      - backend-compatibility
      - sdk
      - sdk-compatibility
      - frontend
      - frontend-lighthouse
      - containers
      - container-platforms
      - security
      - hardened-windows-checkout
      - dependency-review
      - pgvector
      - redis
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          BACKEND_COMPATIBILITY_RESULT: ${{ needs.backend-compatibility.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          CONTAINER_PLATFORMS_RESULT: ${{ needs.container-platforms.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
          EMBEDDED_RESULT: ${{ needs.embedded.result }}
          SQLITE_WINDOWS_RESULT: ${{ needs.sqlite-windows.result }}
          SQLITE_MINIMUM_RESULT: ${{ needs.sqlite-minimum.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_LIGHTHOUSE_RESULT: ${{ needs.frontend-lighthouse.result }}
          HARDENED_WINDOWS_CHECKOUT_RESULT: ${{ needs.hardened-windows-checkout.result }}
          REDIS_RESULT: ${{ needs.redis.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SDK_COMPATIBILITY_RESULT: ${{ needs.sdk-compatibility.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          test "$MYSQL_RESULT" = "success"
          test "$EMBEDDED_RESULT" = "success"
          test "$SQLITE_WINDOWS_RESULT" = "success"
          test "$SQLITE_MINIMUM_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$BACKEND_COMPATIBILITY_RESULT" = "success"
          test "$SDK_RESULT" = "success"
          test "$SDK_COMPATIBILITY_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$FRONTEND_LIGHTHOUSE_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$CONTAINER_PLATFORMS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$HARDENED_WINDOWS_CHECKOUT_RESULT" = "success"
          test "$PGVECTOR_RESULT" = "success"
          test "$REDIS_RESULT" = "success"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$DEPENDENCY_REVIEW_RESULT" = "success"
              ;;
            push|workflow_dispatch)
              test "$DEPENDENCY_REVIEW_RESULT" = "success" \
                || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
              ;;
            *)
              echo "Unexpected Quality gate event" >&2
              exit 1
              ;;
          esac
