name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    name: MySQL 8.4.12 (Linux Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      COVERAGE_FILE: .cache/mysql-coverage/.coverage.mysql
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Sync locked embedded dependencies
        run: uv sync --locked --extra dev --managed-python --python "${{ matrix.python-version }}"
      - name: Verify fixture secret handling and cleanup ownership
        working-directory: .
        run: |
          uv run --project packages/cache --no-sync ruff check --config ruff.toml ops/ci/mysql_fixture.py ops/ci/tests/test_mysql_fixture.py
          uv run --project packages/cache --no-sync ruff format --config ruff.toml --check ops/ci/mysql_fixture.py ops/ci/tests/test_mysql_fixture.py
          uv run --project packages/cache --no-sync pytest -c packages/cache/pyproject.toml ops/ci/tests/test_mysql_fixture.py
      - name: Acquire pinned MySQL image before fixture setup
        # A 256 MiB cold download has its own finite budget; no automatic retries.
        run: uv run --no-sync python ../../ops/ci/mysql_fixture.py --pull-image
      - name: Verify pinned MySQL, mandatory cases and independent wheel
        shell: bash
        run: |
          mkdir -p .cache/mysql-coverage
          uv run --no-sync python ../../ops/ci/mysql_fixture.py -- bash -euc '
            uv run --no-sync python -c "from importlib.metadata import version; assert version(\"PyMySQL\") == \"1.2.3\"; print(\"Verified PyMySQL\", version(\"PyMySQL\"))"
            uv run --no-sync pytest tests/test_mysql*.py --cov=semantix_cache --cov-report= --cov-fail-under=0 --junitxml=.cache/mysql.xml
            uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse(\".cache/mysql.xml\").findall(\".//testcase\"); assert len(cases) >= 213 and all(all(c.find(tag) is None for tag in (\"skipped\", \"failure\", \"error\")) for c in cases), \"Mandatory MySQL cases missing, skipped or failed\""
            uv run --no-sync python -m build
            uv venv --python .venv/bin/python "$RUNNER_TEMP/mysql-wheel"
            wheel_python="$RUNNER_TEMP/mysql-wheel/bin/python"
            uv pip install --python "$wheel_python" "dist/semantix_cache-0.1.0-py3-none-any.whl[mysql]"
            "$wheel_python" -c "from importlib.metadata import version; assert version(\"PyMySQL\") == \"1.2.3\""
            cd "$RUNNER_TEMP"
            "$wheel_python" -I "$GITHUB_WORKSPACE/packages/cache/tests/mysql_wheel_smoke.py"
          '
      - name: Verify bounded MySQL server and driver compatibility
        if: matrix.python-version == '3.11' || matrix.python-version == '3.14'
        shell: bash
        run: |
          coverage="$PWD/.cache/mysql-coverage/.coverage.mysql"
          cp "$coverage" "$RUNNER_TEMP/mysql-baseline.coverage"
          case "${{ matrix.python-version }}" in
            3.11) pairs=("8.4.12:1.2.1") ;;
            3.14) pairs=("8.4.11:1.2.3" "8.4.12:1.2.2") ;;
            *) exit 1 ;;
          esac
          for pair in "${pairs[@]}"; do
            server="${pair%:*}"
            driver="${pair#*:}"
            target="$RUNNER_TEMP/mysql-$server-$driver"
            compat_python="$PWD/.venv/bin/python"
            if [[ "$driver" != "1.2.3" ]]; then
              uv venv --python .venv/bin/python "$target/tests"
              compat_python="$target/tests/bin/python"
              # Preserve locked test tools; replace only the driver in this disposable environment.
              uv export --locked --extra dev --no-emit-project --no-hashes --no-annotate |
                sed "s/^pymysql==1.2.3$/pymysql==$driver/" > "$target/requirements.txt"
              uv pip install --python "$compat_python" -r "$target/requirements.txt" --editable '.[mysql]'
            fi
            uv venv --python .venv/bin/python "$target/wheel"
            wheel_python="$target/wheel/bin/python"
            uv pip install --python "$wheel_python" "dist/semantix_cache-0.1.0-py3-none-any.whl[mysql]" "PyMySQL==$driver"
            uv run --no-sync python ../../ops/ci/mysql_fixture.py --server-version "$server" --pull-image
            uv run --no-sync python ../../ops/ci/mysql_fixture.py --server-version "$server" -- bash -euc '
              "$1" -c "from importlib.metadata import version; import sys; assert version(\"PyMySQL\") == sys.argv[1]; print(\"Verified PyMySQL\", version(\"PyMySQL\"))" "$2"
              "$1" -m pytest tests/test_mysql*.py --no-cov --junitxml="$4"
              "$1" -c "from xml.etree.ElementTree import parse; import sys; cases=parse(sys.argv[1]).findall(\".//testcase\"); assert len(cases) >= 213 and all(all(c.find(tag) is None for tag in (\"skipped\", \"failure\", \"error\")) for c in cases), \"Mandatory compatibility cases missing, skipped or failed\"" "$4"
              "$3" -c "from importlib.metadata import version; import sys; assert version(\"PyMySQL\") == sys.argv[1]" "$2"
              cd "$RUNNER_TEMP"
              "$3" -I "$GITHUB_WORKSPACE/packages/cache/tests/mysql_wheel_smoke.py"
            ' -- "$compat_python" "$driver" "$wheel_python" "$target/tests.xml"
          done
          # Extra certification runs must not overwrite the baseline coverage handoff.
          cmp "$coverage" "$RUNNER_TEMP/mysql-baseline.coverage"
      # Coverage alone is not an independent low-threshold gate: embedded merges
      # this exact Python version before enforcing the unchanged 90% full-package gate.
      - name: Upload MySQL coverage for the existing package gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-coverage-${{ matrix.python-version }}
          path: packages/cache/.cache/mysql-coverage/.coverage.mysql
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  embedded:
    needs: mysql
    name: Embedded cache (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.11"
            postgres-image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
            postgres-major: "16"
            pgvector-version: "0.8.7"
            redis-image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
            redis-version: "7.4.11"
          - python-version: "3.12"
            postgres-image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
            postgres-major: "17"
            pgvector-version: "0.8.5"
            redis-image: redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
            redis-version: "8.2.10"
          - python-version: "3.13"
            postgres-image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
            postgres-major: "17"
            pgvector-version: "0.8.5"
            redis-image: redis:8.6.7@sha256:192fab3335680aa420049026a18dc6baa30a69406cd29af35145bca0523d781a
            redis-version: "8.6.7"
          - python-version: "3.14"
            postgres-image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
            postgres-major: "18"
            pgvector-version: "0.8.7"
            redis-image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
            redis-version: "8.10.2"
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      REDIS_TEST_VERSION: ${{ matrix.redis-version }}
      PGVECTOR_TEST_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/semantix_embedded_test
    services:
      redis:
        image: ${{ matrix.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_DB: semantix_embedded_test
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d semantix_embedded_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historical receipts verify their recorded source, not this checkout.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Sync locked embedded dependencies
        run: uv sync --locked --extra dev --managed-python --python "${{ matrix.python-version }}"
      - name: Verify PostgreSQL and pgvector target
        env:
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres-major }}
          EXPECTED_PGVECTOR_VERSION: ${{ matrix.pgvector-version }}
        run: |
          uv run --no-sync python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def verify():
              connection = await asyncpg.connect(
                  os.environ["PGVECTOR_TEST_DATABASE_URL"], timeout=10, command_timeout=10,
              )
              try:
                  # Explicit operator setup for this disposable CI database.
                  await connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  major = int(await connection.fetchval("SHOW server_version_num")) // 10000
                  vector = await connection.fetchval(
                      "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
                  )
                  expected_major = int(os.environ["EXPECTED_POSTGRES_MAJOR"])
                  expected_vector = os.environ["EXPECTED_PGVECTOR_VERSION"]
                  assert major == expected_major, f"Expected PostgreSQL {expected_major}, got {major}"
                  assert vector == expected_vector, f"Expected pgvector {expected_vector}, got {vector}"
                  server = await connection.fetchval("SHOW server_version")
                  print(f"Verified PostgreSQL {server}; pgvector {vector}; asyncpg {asyncpg.__version__}")
              finally:
                  await connection.close(timeout=10)

          asyncio.run(verify())
          PY
      - name: Verify Redis server target
        run: uv run --no-sync python tests/redis_infrastructure_smoke.py --verify-version
      - name: Fetch recorded reuse-quality source
        run: |
          source_sha=$(uv run --no-sync --offline python -B -c "import json; from pathlib import Path; print(json.loads(Path('../../apps/web/public/benchmarks/reuse-quality-summary.json').read_text(encoding='utf-8'))['source_sha'])")
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          # Full branch history excludes recorded commits whose old refs were removed.
          timeout 60s git fetch --no-tags --depth=1 origin "$source_sha"
      - name: Validate reuse-quality corpus and reviewed evidence
        run: uv run --no-sync --offline python -B -m benchmarks.reuse_quality.benchmark validate
      - name: Lint and check formatting
        run: |
          uv run --no-sync ruff check --config ../../ruff.toml --output-format=github . ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
          uv run --no-sync ruff format --config ../../ruff.toml --check . ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      - name: Check typing
        run: uv run --no-sync mypy src tests examples benchmarks/reuse_quality ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python src examples ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      - name: Download this Python version's MySQL coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mysql-coverage-${{ matrix.python-version }}
          path: packages/cache/.cache/mysql-coverage
      - name: Merge isolated MySQL evidence before the unchanged coverage gate
        run: uv run --no-sync coverage combine --keep .cache/mysql-coverage/.coverage.mysql
      # The shared suite collects real MemoryStore/PgVectorStore and the standalone custom consumer.
      - name: Test store conformance, embedded behavior and coverage
        run: |
          uv run --no-sync python ../../ops/ci/required_tests.py embedded .cache/embedded.xml -- -m "not mysql" --cov=semantix_cache --cov-append
      - name: Execute custom integration examples
        run: |
          uv run --no-sync python examples/custom_integration.py
          uv run --no-sync python -m examples.custom_store
          uv run --no-sync python -m examples.sqlite_cache
      - name: Execute persistent support example
        env:
          SEMANTIX_CACHE_DATABASE_URL: ${{ env.PGVECTOR_TEST_DATABASE_URL }}
          SEMANTIX_CACHE_MIGRATION_DATABASE_URL: ${{ env.PGVECTOR_TEST_DATABASE_URL }}
        run: |
          uv run --no-sync python -m examples.persistent_support --initialize
          uv run --no-sync python -m examples.persistent_support
      - name: Build and inspect artifacts
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python -m twine check dist/*
          uv run --no-sync python tests/check_artifacts.py
      - name: Verify isolated wheel and namespace coexistence
        shell: bash
        run: |
          uv run --no-sync python -m venv "$RUNNER_TEMP/semantix-embedded-wheel"
          wheel_python="$RUNNER_TEMP/semantix-embedded-wheel/bin/python"
          "$wheel_python" -m pip install --disable-pip-version-check dist/*.whl
          "$wheel_python" tests/wheel_smoke.py
          "$wheel_python" -m tests.sqlite_wheel_smoke
          for extra in openai huggingface gemini ollama anthropic providers; do
            "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[$extra]"
            "$wheel_python" -c "import sys; from semantix_cache import MemoryStore; import semantix_cache.adapters; assert 'httpx' not in sys.modules"
            "$wheel_python" tests/providers_wheel_smoke.py
          done
          "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[pgvector]" "asyncpg==0.31.0"
          "$wheel_python" -c "import asyncpg; assert asyncpg.__version__ == '0.31.0'"
          "$wheel_python" tests/pgvector_wheel_smoke.py
          "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[redis]"
          "$wheel_python" tests/redis_wheel_smoke.py
          "$wheel_python" -m pip install --disable-pip-version-check ../client
          "$wheel_python" -c "import sys; import semantix_client; assert 'semantix_cache' not in sys.modules; import semantix_cache; assert semantix_client.CachePolicy is not semantix_cache.CachePolicy"
      - name: Certify exact asyncpg 0.32.0 at Python boundaries
        if: matrix.python-version == '3.11' || matrix.python-version == '3.14'
        timeout-minutes: 4
        shell: bash
        env:
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres-major }}
          EXPECTED_PGVECTOR_VERSION: ${{ matrix.pgvector-version }}
        run: |
          (
            cd ../..
            uv run --project packages/cache --no-sync ruff check --config ruff.toml ops/ci/postgresql_candidate_certification.py ops/ci/tests/test_postgresql_candidate_certification.py
            uv run --project packages/cache --no-sync ruff format --config ruff.toml --check ops/ci/postgresql_candidate_certification.py ops/ci/tests/test_postgresql_candidate_certification.py
          )
          uv run --no-sync mypy --strict ../../ops/ci/postgresql_candidate_certification.py ../../ops/ci/tests/test_postgresql_candidate_certification.py
          uv run --no-sync pytest ../../ops/ci/tests/test_postgresql_candidate_certification.py
          uv run --no-sync python ../../ops/ci/postgresql_candidate_certification.py
      - name: Verify real TLS and direct ALPN on PostgreSQL 18
        if: matrix.python-version == '3.14'
        timeout-minutes: 4
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          tls_dir="$RUNNER_TEMP/asyncpg-tls"
          umask 077
          mkdir -p "$tls_dir"
          trap 'rm -f "$tls_dir/ca.key" "$tls_dir/bad-ca.key" "$tls_dir/server.key"; docker exec "$POSTGRES_CONTAINER" rm -f /tmp/semantix-server.key' EXIT
          for authority in ca bad-ca; do
            openssl req -x509 -newkey rsa:2048 -noenc -days 1 -subj "/CN=semantix-$authority" \
              -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
              -keyout "$tls_dir/$authority.key" -out "$tls_dir/$authority.crt"
          done
          openssl req -newkey rsa:2048 -noenc -subj /CN=localhost -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr"
          printf '%s\n' 'subjectAltName=DNS:localhost' 'extendedKeyUsage=serverAuth' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'basicConstraints=critical,CA:FALSE' > "$tls_dir/extensions"
          openssl x509 -req -days 1 -in "$tls_dir/server.csr" -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" \
            -CAcreateserial -extfile "$tls_dir/extensions" -out "$tls_dir/server.crt"
          docker cp "$tls_dir/server.key" "$POSTGRES_CONTAINER:/tmp/semantix-server.key"
          docker cp "$tls_dir/server.crt" "$POSTGRES_CONTAINER:/tmp/semantix-server.crt"
          docker exec "$POSTGRES_CONTAINER" chown postgres:postgres /tmp/semantix-server.key /tmp/semantix-server.crt
          docker exec "$POSTGRES_CONTAINER" chmod 600 /tmp/semantix-server.key
          for setting in "ssl_cert_file='/tmp/semantix-server.crt'" "ssl_key_file='/tmp/semantix-server.key'" "ssl='on'"; do
            docker exec "$POSTGRES_CONTAINER" psql -U postgres -d semantix_embedded_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET $setting"
          done
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d semantix_embedded_test -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
          export TLS_CA="$tls_dir/ca.crt" TLS_BAD_CA="$tls_dir/bad-ca.crt"
          EXPECTED_ASYNCPG_DRIVER=0.31.0 uv run --no-sync python tests/pgvector_tls_smoke.py
          EXPECTED_ASYNCPG_DRIVER=0.32.0 "$RUNNER_TEMP/asyncpg-032/driver/bin/python" tests/pgvector_tls_smoke.py
          export PGVECTOR_TEST_DATABASE_URL="${PGVECTOR_TEST_DATABASE_URL/127.0.0.1/localhost}?sslmode=verify-full&sslrootcert=$TLS_CA"
          "$RUNNER_TEMP/semantix-embedded-wheel/bin/python" -I tests/pgvector_wheel_smoke.py
          "$RUNNER_TEMP/asyncpg-032/wheel/bin/python" -I tests/pgvector_wheel_smoke.py
          cmp .coverage "$RUNNER_TEMP/asyncpg-032/baseline.coverage"

  sqlite-windows:
    name: SQLite Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: Sync a patched managed Python
        run: uv sync --locked --extra dev --managed-python --python "${{ matrix.python-version }}"
      - name: Require SQLite conformance without skips
        run: |
          uv run --no-sync python -c "import sqlite3; print(sqlite3.sqlite_version, sqlite3.threadsafety)"
          uv run --no-sync pytest tests/test_sqlite.py tests/test_sqlite_faults.py tests/test_sqlite_processes.py tests/test_sqlite_conformance.py --junitxml=.cache/sqlite.xml
          uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse('.cache/sqlite.xml').findall('.//testcase'); assert cases and all(c.find('skipped') is None for c in cases), 'Required SQLite tests skipped'"
          uv run --no-sync python -m examples.sqlite_cache
      - name: Build and verify a clean installed SQLite consumer
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python tests/check_artifacts.py
          uv venv --python .venv/Scripts/python.exe "$RUNNER_TEMP/sqlite-wheel"
          wheel_python="$RUNNER_TEMP/sqlite-wheel/Scripts/python.exe"
          uv pip install --python "$wheel_python" dist/*.whl
          "$wheel_python" -m tests.sqlite_wheel_smoke

  sqlite-minimum:
    name: SQLite minimum (Linux 3.51.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.14-slim@sha256:83ff1d245a3d57d04152252d3ef9cb361494d0b3395abd65a5ebe91c401c8e83
    defaults:
      run:
        working-directory: packages/cache
    steps:
      - name: Install disposable build tooling
        working-directory: /
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git gcc libc6-dev make tcl
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: Build checksum-verified official minimum in a private directory
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, subprocess, urllib.request, zipfile
          data = urllib.request.urlopen('https://sqlite.org/2026/sqlite-amalgamation-3510300.zip', timeout=60).read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              source = archive.read('sqlite-amalgamation-3510300/sqlite3.c')
          assert hashlib.sha3_256(source).hexdigest() == '32d5424f97e0a7fc5ed2f6335afbb58be4e0298bd7117a34e39d345ff13d859e'
          folder = pathlib.Path('/tmp/sqlite-min')
          folder.mkdir()
          (folder / 'sqlite3.c').write_bytes(source)
          subprocess.run(['cc', '-O2', '-fPIC', '-shared', str(folder / 'sqlite3.c'), '-o', str(folder / 'libsqlite3.so.0'), '-lpthread', '-ldl'], check=True, timeout=120)
          PY
      - name: Sync locked dependencies with the stock dynamically linked Python
        run: uv sync --locked --extra dev --python /usr/local/bin/python
      - name: Require actual minimum-runtime conformance without skips
        env:
          LD_LIBRARY_PATH: /tmp/sqlite-min
        run: |
          uv run --no-sync python -c "import sqlite3; print(sqlite3.sqlite_version, sqlite3.threadsafety); assert sqlite3.sqlite_version == '3.51.3'"
          uv run --no-sync pytest tests/test_sqlite.py tests/test_sqlite_faults.py tests/test_sqlite_processes.py tests/test_sqlite_conformance.py --junitxml=.cache/sqlite.xml
          uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse('.cache/sqlite.xml').findall('.//testcase'); assert cases and all(c.find('skipped') is None for c in cases), 'Required SQLite tests skipped'"
          uv run --no-sync python -m examples.sqlite_cache

      - name: Verify exact WAL-patched backports and independent wheels
        run: |
          (
            cd ../..
            uv run --project packages/cache --no-sync ruff check --config ruff.toml ops/ci/sqlite_backport_certification.py ops/ci/tests/test_sqlite_backport_certification.py
            uv run --project packages/cache --no-sync ruff format --config ruff.toml --check ops/ci/sqlite_backport_certification.py ops/ci/tests/test_sqlite_backport_certification.py
          )
          uv run --no-sync mypy --strict ../../ops/ci/sqlite_backport_certification.py ../../ops/ci/tests/test_sqlite_backport_certification.py
          uv run --no-sync pytest ../../ops/ci/tests/test_sqlite_backport_certification.py
          uv run --no-sync python ../../ops/ci/sqlite_backport_certification.py

  redis:
    name: Redis restart and fault integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cache
    env:
      REDIS_TEST_URL: redis://127.0.0.1:16379/0
      REDIS_TEST_VERSION: "8.10.2"
      REDIS_TEST_CONTAINER: semantix-redis-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Sync locked embedded dependencies
        run: uv sync --locked --extra dev
      - name: Start labelled disposable AOF Redis
        run: >-
          docker run --detach --name "$REDIS_TEST_CONTAINER"
          --label semantix.disposable=redis-store
          --publish 127.0.0.1:16379:6379
          redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
          redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
      - name: Verify AOF restart and real OOM/read-only failures
        run: uv run --no-sync python tests/redis_infrastructure_smoke.py
      - name: Measure supported exact scan workloads
        run: uv run --no-sync python tests/redis_benchmark_smoke.py
      - name: Upload Redis performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/cache/.cache/redis-performance.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify remaining Redis families and oldest restart boundary
        shell: bash
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python tests/check_artifacts.py
          uv venv --python .venv/bin/python "$RUNNER_TEMP/redis-compatibility-wheel"
          wheel_python="$RUNNER_TEMP/redis-compatibility-wheel/bin/python"
          uv pip install --python "$wheel_python" "dist/semantix_cache-0.1.0-py3-none-any.whl[redis]"
          compatibility_owner="redis-store-compat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          compatibility_container=""
          cleanup_compatibility() {
            if [[ -n "$compatibility_container" ]] && docker inspect "$compatibility_container" > /dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "semantix.disposable" }}' "$compatibility_container")" = "$compatibility_owner"
              docker rm --force --volumes "$compatibility_container"
            fi
          }
          trap cleanup_compatibility EXIT
          for target in \
            "7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85" \
            "8.4.7@sha256:43afe4a9a43080e64dfa29699eef903fc9d54991fe8b03d57237c05bed2a396c" \
            "8.8.3@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d"; do
            export REDIS_TEST_VERSION="${target%@*}"
            compatibility_container="semantix-redis-compat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${REDIS_TEST_VERSION//./-}"
            # A fixed host port survives restart; these targets run sequentially.
            docker run --detach --name "$compatibility_container" \
              --label "semantix.disposable=$compatibility_owner" \
              --publish 127.0.0.1:16380:6379 "redis:$target" \
              redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
            export REDIS_TEST_URL="redis://127.0.0.1:16380/0"
            export REDIS_TEST_CONTAINER="$compatibility_container"
            uv run --no-sync python tests/redis_infrastructure_smoke.py --verify-version
            uv run --no-sync python ../../ops/ci/required_tests.py redis ".cache/redis-$REDIS_TEST_VERSION.xml" -- tests/test_redis*.py tests/test_inspection.py -k redis
            "$wheel_python" tests/redis_wheel_smoke.py
            uv run --no-sync python tests/redis_infrastructure_smoke.py
            cleanup_compatibility
            compatibility_container=""
          done
      - name: Verify exact alternate Redis drivers and independent wheels
        shell: bash
        run: |
          (
            cd ../..
            uv run --project packages/cache --no-sync ruff check --config ruff.toml ops/ci/tests/test_redis_driver_certification.py
            uv run --project packages/cache --no-sync ruff format --config ruff.toml --check ops/ci/tests/test_redis_driver_certification.py
          )
          uv run --no-sync mypy --strict ../../ops/ci/tests/test_redis_driver_certification.py
          uv run --no-sync pytest ../../ops/ci/tests/test_redis_driver_certification.py
          bash ../../ops/ci/redis_driver_certification.sh
      - name: Certify exact Valkey 9.1.2 through RedisStore
        timeout-minutes: 4
        shell: bash
        env:
          REDIS_TEST_PRODUCT: valkey
          REDIS_TEST_VERSION: "9.1.2"
          REDIS_TEST_URL: redis://127.0.0.1:16381/0
          REDIS_TEST_CONTAINER: semantix-redis-valkey-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          image="valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
          owner="redis-store-valkey-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_valkey() {
            if docker inspect "$REDIS_TEST_CONTAINER" > /dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "semantix.disposable" }}' "$REDIS_TEST_CONTAINER")" = "$owner"
              test "$(docker inspect --format '{{.Config.Image}}' "$REDIS_TEST_CONTAINER")" = "$image"
              docker rm --force --volumes "$REDIS_TEST_CONTAINER"
            fi
          }
          trap cleanup_valkey EXIT
          docker run --detach --platform linux/amd64 --name "$REDIS_TEST_CONTAINER" \
            --label "semantix.disposable=$owner" --memory 512m --cpus 2 \
            --publish 127.0.0.1:16381:6379 "$image" \
            valkey-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
          test "$(docker inspect --format '{{.Architecture}}/{{.Os}}' "$image")" = "amd64/linux"
          uv run --no-sync python -c "from importlib.metadata import version; assert version('redis') == '8.1.0'"
          uv run --no-sync python tests/redis_infrastructure_smoke.py --verify-version
          uv run --no-sync python ../../ops/ci/required_tests.py redis .cache/valkey-9.1.2.xml -- tests/test_redis*.py tests/test_inspection.py -k redis
          uv run --no-sync python tests/redis_infrastructure_smoke.py
          uv venv --python .venv/bin/python "$RUNNER_TEMP/valkey-wheel"
          wheel_python="$RUNNER_TEMP/valkey-wheel/bin/python"
          uv pip install --python "$wheel_python" "dist/semantix_cache-0.1.0-py3-none-any.whl[redis]" "redis==8.1.0"
          "$wheel_python" -I -c "from importlib.metadata import version; assert version('redis') == '8.1.0'"
          "$wheel_python" -I tests/redis_wheel_smoke.py
      - name: Remove only this job's labelled container and volumes
        if: ${{ always() }}
        run: |
          if docker inspect "$REDIS_TEST_CONTAINER" > /dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "semantix.disposable" }}' "$REDIS_TEST_CONTAINER")" = "redis-store"
            docker rm --force --volumes "$REDIS_TEST_CONTAINER"
          fi

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    env:
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
      CACHE_BACKEND: memory
      AUTH_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev --extra redis

      - name: Run Ruff lint
        run: uv run --no-sync ruff check --config ../../ruff.toml --output-format=github .

      - name: Run operational Ruff lint
        working-directory: .
        run: >-
          uv run --project apps/server --no-sync ruff check
          --config ruff.toml
          --output-format=github
          ops

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --config ../../ruff.toml --check .

      - name: Run mypy
        run: uv run --no-sync mypy app tests scripts ../../scripts/dev.py
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python app scripts ../../scripts/dev.py

      - name: Run backend unit tests with coverage
        run: uv run --no-sync pytest -m "not pgvector and not redis" --cov=app

      - name: Verify required-test execution guard controls
        working-directory: .
        run: |
          uv run --project apps/server --no-sync ruff format --config ruff.toml --check ops/ci/required_tests.py ops/ci/tests/test_required_tests.py
          uv run --project apps/server --no-sync pytest -c packages/cache/pyproject.toml ops/ci/tests/test_required_tests.py

      - name: Verify development launcher boundaries
        working-directory: .
        run: |
          uv run --project apps/server --no-sync ruff check --config ruff.toml scripts/dev.py ops/ci/tests/test_dev_startup.py
          uv run --project apps/server --no-sync ruff format --config ruff.toml --check scripts/dev.py ops/ci/tests/test_dev_startup.py
          uv run --project apps/server --no-sync python -m pytest -c packages/cache/pyproject.toml ops/ci/tests/test_dev_startup.py

