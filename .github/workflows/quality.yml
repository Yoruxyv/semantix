name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded:
    name: Embedded cache (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      PGVECTOR_TEST_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/semantix_embedded_test
    services:
      redis:
        image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: semantix_embedded_test
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d semantix_embedded_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Sync locked embedded dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Validate reuse-quality corpus and reviewed evidence
        run: uv run --no-sync --offline python -B -m benchmarks.reuse_quality.benchmark validate
      - name: Lint and check formatting
        run: |
          uv run --no-sync ruff check --config ../../ruff.toml --output-format=github . ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
          uv run --no-sync ruff format --config ../../ruff.toml --check . ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      - name: Check typing
        run: uv run --no-sync mypy src tests examples benchmarks/reuse_quality ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python src examples ../../scripts/provider_live_verify.py ../../scripts/provider_live_verification
      # The shared suite collects real MemoryStore/PgVectorStore and the standalone custom consumer.
      - name: Test store conformance, embedded behavior and coverage
        run: |
          uv run --no-sync pytest --cov=semantix_cache --junitxml=.cache/embedded.xml
          uv run --no-sync python -c "from xml.etree.ElementTree import parse; cases=parse('.cache/embedded.xml').findall('.//testcase'); redis=[c for c in cases if c.get('classname', '').startswith('tests.test_redis')]; assert redis and all(c.find('skipped') is None for c in redis), 'Required Redis tests skipped'"
      - name: Execute custom integration examples
        run: |
          uv run --no-sync python examples/custom_integration.py
          uv run --no-sync python -m examples.custom_store
      - name: Execute persistent support example
        env:
          SEMANTIX_CACHE_DATABASE_URL: ${{ env.PGVECTOR_TEST_DATABASE_URL }}
          SEMANTIX_CACHE_MIGRATION_DATABASE_URL: ${{ env.PGVECTOR_TEST_DATABASE_URL }}
        run: |
          uv run --no-sync python -m examples.persistent_support --initialize
          uv run --no-sync python -m examples.persistent_support
      - name: Build and inspect artifacts
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python -m twine check dist/*
          uv run --no-sync python tests/check_artifacts.py
      - name: Verify isolated wheel and namespace coexistence
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/semantix-embedded-wheel"
          wheel_python="$RUNNER_TEMP/semantix-embedded-wheel/bin/python"
          "$wheel_python" -m pip install --disable-pip-version-check dist/*.whl
          "$wheel_python" tests/wheel_smoke.py
          for extra in openai huggingface gemini ollama anthropic providers; do
            "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[$extra]"
            "$wheel_python" -c "import sys; from semantix_cache import MemoryStore; import semantix_cache.adapters; assert 'httpx' not in sys.modules"
            "$wheel_python" tests/providers_wheel_smoke.py
          done
          "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[pgvector]"
          "$wheel_python" tests/pgvector_wheel_smoke.py
          "$wheel_python" -m pip install --disable-pip-version-check "dist/semantix_cache-0.1.0-py3-none-any.whl[redis]"
          "$wheel_python" tests/redis_wheel_smoke.py
          "$wheel_python" -m pip install --disable-pip-version-check ../client
          "$wheel_python" -c "import sys; import semantix_client; assert 'semantix_cache' not in sys.modules; import semantix_cache; assert semantix_client.CachePolicy is not semantix_cache.CachePolicy"


  redis:
    name: Redis restart and fault integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cache
    env:
      REDIS_TEST_URL: redis://127.0.0.1:16379/0
      REDIS_TEST_CONTAINER: semantix-redis-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Sync locked embedded dependencies
        run: uv sync --locked --extra dev
      - name: Start labelled disposable AOF Redis
        run: >-
          docker run --detach --name "$REDIS_TEST_CONTAINER"
          --label semantix.disposable=redis-store
          --publish 127.0.0.1:16379:6379
          redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
          redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
      - name: Verify AOF restart and real OOM/read-only failures
        run: uv run --no-sync python tests/redis_infrastructure_smoke.py
      - name: Measure supported exact scan workloads
        run: uv run --no-sync python tests/redis_benchmark_smoke.py
      - name: Upload Redis performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/cache/.cache/redis-performance.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's labelled container and volumes
        if: ${{ always() }}
        run: |
          if docker inspect "$REDIS_TEST_CONTAINER" > /dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "semantix.disposable" }}' "$REDIS_TEST_CONTAINER")" = "redis-store"
            docker rm --force --volumes "$REDIS_TEST_CONTAINER"
          fi

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    env:
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
      CACHE_BACKEND: memory
      AUTH_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff lint
        run: uv run --no-sync ruff check --config ../../ruff.toml --output-format=github .

      - name: Run operational Ruff lint
        run: >-
          uv run --no-sync ruff check
          --config ../../ruff.toml
          --output-format=github
          ../../ops

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --config ../../ruff.toml --check .

      - name: Run mypy
        run: uv run --no-sync mypy app tests scripts
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python app scripts

      - name: Run backend unit tests with coverage
        run: uv run --no-sync pytest -m "not pgvector" --cov=app

  backend-compatibility:
    name: Backend compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    env:
      AUTH_MODE: disabled
      CACHE_BACKEND: memory
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Run backend compatibility tests
        run: uv run --no-sync --python "${{ matrix.python-version }}" pytest -m "not pgvector"

  sdk:
    name: Python SDK quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/client
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      AUTH_MODE: token
      AUTH_PRINCIPALS: >-
        [{"name":"sdk-operator","token_sha256":"ccfa50520ce4ed853c9d2e82d8caee8c34ac8c0fd22cfe2d4f387f6006dd194c","role":"operator","namespaces":["normal","read-only","refresh","bypass","private","async"]}]
      CACHE_BACKEND: memory
      EMBEDDING_PROVIDER: mock
      EVALUATION_DATASET_STORAGE: session
      EVALUATION_RUN_HISTORY_STORAGE: disabled
      GENERATION_PROVIDER: mock
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
      RATE_LIMIT: 100/minute
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked SDK dependencies
        run: uv sync --locked --extra dev

      - name: Sync locked backend dependencies
        working-directory: apps/server
        run: uv sync --locked --extra dev

      - name: Run SDK Ruff lint
        run: uv run --no-sync ruff check --config ../../ruff.toml --output-format=github .

      - name: Check SDK Ruff formatting
        run: uv run --no-sync ruff format --config ../../ruff.toml --check .

      - name: Run SDK mypy
        run: uv run --no-sync mypy src tests
      - name: Set up Node for Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Pyright
        run: >-
          npx --yes pyright@1.1.414 --project ../../pyrightconfig.json
          --pythonpath .venv/bin/python src

      - name: Run SDK unit tests with coverage
        run: uv run --no-sync pytest -m "not integration" --cov=semantix_client

      - name: Check backend OpenAPI contract for SDK routes
        working-directory: apps/server
        run: uv run --no-sync pytest tests/query/api/test_sdk_contract.py

      - name: Run SDK real-HTTP integration tests
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          cd apps/server
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 18081 > /tmp/semantix-sdk-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/health > /dev/null

          cd ../../packages/client
          SEMANTIX_INTEGRATION_URL=http://127.0.0.1:18081 \
            SEMANTIX_INTEGRATION_TOKEN=sdk-operator-token \
            uv run --no-sync pytest -m integration

      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build

      - name: Check package artifacts
        run: uv run --no-sync python -m twine check dist/*

      - name: Enforce SDK artifact and dependency allowlists
        run: uv run --no-sync python tests/check_artifacts.py

      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/semantix-sdk-smoke"
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -c \
            "from semantix_client import AsyncSemantixClient, CachePolicy, SemantixClient"
          "$RUNNER_TEMP/semantix-sdk-smoke/bin/python" -c \
            "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('semantix', 'app', 'backend', 'fastapi', 'asyncpg', 'numpy', 'pydantic', 'sqlalchemy', 'starlette', 'psycopg'))"

  sdk-compatibility:
    name: Python SDK compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/client
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked SDK dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Run SDK compatibility tests
        run: >-
          uv run --no-sync --python "${{ matrix.python-version }}"
          pytest -m "not integration"

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check import normalization
        run: npm run imports:check

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Report frontend bundle budget
        run: npm run bundle:check

  frontend-lighthouse:
    name: Frontend Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      AUTH_MODE: disabled
      CACHE_BACKEND: memory
      EMBEDDING_PROVIDER: mock
      EVALUATION_DATASET_STORAGE: session
      EVALUATION_RUN_HISTORY_STORAGE: disabled
      GENERATION_PROVIDER: mock
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Install locked dependencies
        run: |
          npm --prefix apps/web ci
          uv --directory apps/server sync --locked --extra dev

      - name: Run production Lighthouse budget
        shell: bash
        run: |
          set -euo pipefail
          cd apps/server
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/semantix-lighthouse-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health > /dev/null

          cd ../web
          npm run lighthouse

      - name: Upload Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare example environments
        run: |
          cp apps/server/.env.example apps/server/.env
          cp .env.production.example .env.production

      - name: Verify approved container image pins
        run: python ops/ci/verify_image_pins.py

      - name: Validate compatibility Compose file
        run: docker compose config --quiet

      - name: Validate development Compose file
        run: docker compose -f docker-compose.dev.yml --profile pgvector config --quiet

      - name: Validate hardened Compose file
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Verify development health gates
        shell: bash
        run: bash ops/ci/linux/dev-healthcheck-smoke.sh

  hardened-windows-checkout:
    name: Hardened Windows-checkout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:18080"]'
      COMPOSE_PROJECT_NAME: semantix-eol-${{ github.run_id }}
      POSTGRES_DB: semantix
      POSTGRES_MIGRATION_USER: semantix_migrator
      POSTGRES_RUNTIME_USER: semantix_runtime
      SEMANTIX_BIND_ADDRESS: 127.0.0.1
      SEMANTIX_PORT: "18080"
      MOCK_GENERATION_DELAY_SECONDS: "2"
      RATE_LIMIT: "80/minute"
      TRUSTED_PROXY_CIDRS: '["172.28.0.0/24"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify tracked shell scripts use LF
        run: |
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Create an autocrlf checkout
        shell: bash
        run: |
          git -c core.autocrlf=true clone --quiet --no-local \
            . "$RUNNER_TEMP/semantix-autocrlf"
          cd "$RUNNER_TEMP/semantix-autocrlf"
          git ls-files --eol '*.sh'
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Install browser test dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf/apps/web"
          npm ci

          # Install OS dependencies once. Retrying --with-deps after a timeout
          # can leave apt/dpkg work alive and make the retry fail on its lock.
          npx playwright install-deps chromium

          for attempt in 1 2; do
            if timeout --kill-after=30s 5m \
              npx playwright install chromium; then
              exit 0
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "::error::Playwright browser installation failed twice"
              exit 1
            fi
            echo "::warning::Playwright browser download stalled or failed; retrying once"
            sleep 5
          done

      - name: Run hardened-stack API, browser, axe, and scaling smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf"
          bash ops/ci/linux/hardened-smoke.sh bash -c 'npm --prefix apps/web run test:e2e && python3 ops/ci/two_replica_smoke.py && python3 ops/ci/autoscaling_smoke.py'

      - name: Verify gateway reset resilience
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf"
          python3 ops/ci/gateway_reset_smoke.py

  pgvector:
    name: Pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    env:
      PGVECTOR_TEST_DATABASE_URL: "postgresql://semantix:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/semantix"
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: semantix
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_USER: semantix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantix -d semantix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Run pgvector integration tests
        run: uv run --no-sync pytest -m pgvector

      - name: Exercise pgvector backup and restore
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        working-directory: .
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_dump -U semantix -d semantix -Fc -f /tmp/semantix.dump
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb -U semantix semantix_restore
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore -U semantix -d semantix_restore /tmp/semantix.dump
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql -U semantix -d semantix_restore -Atc \
              "SELECT to_regclass('semantix.cache_entries') IS NOT NULL"
          )" = "t"

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The affected unstable RSC APIs are not used by this client-only SPA.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          fail-on-severity: high

  container-platforms:
    name: Container platforms (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-production
            context: .
            dockerfile: apps/server/Dockerfile
          - name: backend-development
            context: .
            dockerfile: apps/server/Dockerfile.dev
          - name: frontend-production
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: frontend-development
            context: apps/web
            dockerfile: apps/web/Dockerfile.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 and arm64 images
        run: >-
          docker buildx build
          --file "${{ matrix.dockerfile }}"
          --platform linux/amd64,linux/arm64
          --output type=cacheonly
          "${{ matrix.context }}"

  security:
    name: Security checks
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - embedded
      - backend
      - backend-compatibility
      - sdk
      - sdk-compatibility
      - frontend
      - frontend-lighthouse
      - containers
      - container-platforms
      - security
      - hardened-windows-checkout
      - dependency-review
      - pgvector
      - redis
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          BACKEND_COMPATIBILITY_RESULT: ${{ needs.backend-compatibility.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          CONTAINER_PLATFORMS_RESULT: ${{ needs.container-platforms.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EMBEDDED_RESULT: ${{ needs.embedded.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_LIGHTHOUSE_RESULT: ${{ needs.frontend-lighthouse.result }}
          HARDENED_WINDOWS_CHECKOUT_RESULT: ${{ needs.hardened-windows-checkout.result }}
          REDIS_RESULT: ${{ needs.redis.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SDK_COMPATIBILITY_RESULT: ${{ needs.sdk-compatibility.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          test "$EMBEDDED_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$BACKEND_COMPATIBILITY_RESULT" = "success"
          test "$SDK_RESULT" = "success"
          test "$SDK_COMPATIBILITY_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$FRONTEND_LIGHTHOUSE_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$CONTAINER_PLATFORMS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$HARDENED_WINDOWS_CHECKOUT_RESULT" = "success"
          test "$PGVECTOR_RESULT" = "success"
          test "$REDIS_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" \
            || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
