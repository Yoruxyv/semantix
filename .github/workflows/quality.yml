name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
      CACHE_BACKEND: memory
      AUTH_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check .

      - name: Run mypy
        run: uv run --no-sync mypy app tests scripts

      - name: Run backend unit tests with coverage
        run: uv run --no-sync pytest -m "not pgvector" --cov=app

  backend-compatibility:
    name: Backend compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_MODE: disabled
      CACHE_BACKEND: memory
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Run backend compatibility tests
        run: uv run --no-sync --python "${{ matrix.python-version }}" pytest -m "not pgvector"

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check import normalization
        run: npm run imports:check

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Report frontend bundle budget
        run: npm run bundle:check

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare example environments
        run: |
          cp backend/.env.example backend/.env
          cp .env.production.example .env.production

      - name: Verify approved container image pins
        run: python ops/ci/verify_image_pins.py

      - name: Validate compatibility Compose file
        run: docker compose config --quiet

      - name: Validate development Compose file
        run: docker compose -f docker-compose.dev.yml --profile pgvector config --quiet

      - name: Validate hardened Compose file
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Verify development health gates
        shell: bash
        run: bash ops/ci/linux/dev-healthcheck-smoke.sh

  hardened-windows-checkout:
    name: Hardened Windows-checkout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOWED_ORIGINS: '["http://127.0.0.1:18080"]'
      COMPOSE_PROJECT_NAME: semantix-eol-${{ github.run_id }}
      POSTGRES_DB: semantix
      POSTGRES_MIGRATION_USER: semantix_migrator
      POSTGRES_RUNTIME_USER: semantix_runtime
      SEMANTIX_BIND_ADDRESS: 127.0.0.1
      SEMANTIX_PORT: "18080"
      TRUSTED_PROXY_CIDRS: '["172.28.0.0/24"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify tracked shell scripts use LF
        run: |
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Create an autocrlf checkout
        shell: bash
        run: |
          git -c core.autocrlf=true clone --quiet --no-local \
            . "$RUNNER_TEMP/semantix-autocrlf"
          cd "$RUNNER_TEMP/semantix-autocrlf"
          git ls-files --eol '*.sh'
          bash ops/ci/linux/check-shell-eol.sh
          pwsh -File ops/ci/windows/check-shell-eol.ps1

      - name: Install browser test dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf/frontend"
          npm ci
          for attempt in 1 2; do
            if timeout --kill-after=30s 5m \
              npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "::error::Playwright browser installation failed twice"
              exit 1
            fi
            echo "::warning::Playwright browser installation stalled or failed; retrying once"
            sleep 5
          done

      - name: Run hardened-stack API, browser, and axe smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP/semantix-autocrlf"
          bash ops/ci/linux/hardened-smoke.sh npm --prefix frontend run test:e2e

  pgvector:
    name: Pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PGVECTOR_TEST_DATABASE_URL: "postgresql://semantix:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/semantix"
      PYTHONPYCACHEPREFIX: /tmp/semantix-cache/python
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: semantix
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_USER: semantix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantix -d semantix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Run pgvector integration tests
        run: uv run --no-sync pytest -m pgvector

      - name: Exercise pgvector backup and restore
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        working-directory: .
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_dump -U semantix -d semantix -Fc -f /tmp/semantix.dump
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb -U semantix semantix_restore
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore -U semantix -d semantix_restore /tmp/semantix.dump
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql -U semantix -d semantix_restore -Atc \
              "SELECT to_regclass('semantix.cache_entries') IS NOT NULL"
          )" = "t"

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The affected unstable RSC APIs are not used by this client-only SPA.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          fail-on-severity: high

  container-platforms:
    name: Container platforms (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-production
            context: backend
            dockerfile: backend/Dockerfile
          - name: backend-development
            context: backend
            dockerfile: backend/Dockerfile.dev
          - name: frontend-production
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: frontend-development
            context: frontend
            dockerfile: frontend/Dockerfile.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 and arm64 images
        run: >-
          docker buildx build
          --file "${{ matrix.dockerfile }}"
          --platform linux/amd64,linux/arm64
          --output type=cacheonly
          "${{ matrix.context }}"

  security:
    name: Security checks
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - backend
      - backend-compatibility
      - frontend
      - containers
      - container-platforms
      - security
      - hardened-windows-checkout
      - dependency-review
      - pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          BACKEND_COMPATIBILITY_RESULT: ${{ needs.backend-compatibility.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          CONTAINER_PLATFORMS_RESULT: ${{ needs.container-platforms.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          HARDENED_WINDOWS_CHECKOUT_RESULT: ${{ needs.hardened-windows-checkout.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$BACKEND_COMPATIBILITY_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$CONTAINER_PLATFORMS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$HARDENED_WINDOWS_CHECKOUT_RESULT" = "success"
          test "$PGVECTOR_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" \
            || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
