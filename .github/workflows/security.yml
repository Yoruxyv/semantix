name: Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed changes for verified secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results=verified
          version: "3.97.0"

  image-scan:
    name: Image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
            image: semantix-ci-backend:scan
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: semantix-ci-frontend:scan
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}"
          "${{ matrix.context }}"

      - name: Scan image for actionable high-severity vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          config: .grype.yaml
          fail-build: true
          grype-version: v0.116.0
          image: ${{ matrix.image }}
          only-fixed: true
          output-format: table
          severity-cutoff: high

  supply-chain-artifacts:
    name: SBOM and build provenance
    needs:
      - image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create supply-chain artifact directory
        run: mkdir supply-chain

      - name: Build backend with provenance metadata
        run: >-
          docker buildx build
          --file backend/Dockerfile
          --load
          --metadata-file supply-chain/backend.provenance.json
          --tag semantix-sbom-backend:ci
          .

      - name: Build frontend with provenance metadata
        run: >-
          docker buildx build
          --file frontend/Dockerfile
          --load
          --metadata-file supply-chain/frontend.provenance.json
          --tag semantix-sbom-frontend:ci
          frontend

      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: semantix-sbom-backend:ci
          output-file: supply-chain/backend.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: semantix-sbom-frontend:ci
          output-file: supply-chain/frontend.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM and provenance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: semantix-supply-chain-${{ github.sha }}
          path: supply-chain/*.json
          retention-days: 14
