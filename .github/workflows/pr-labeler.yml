name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # SECURITY: pull_request_target has access to the base repository token.
      # Do not check out or execute pull-request code in this workflow.
      - name: Apply Conventional Commit type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          managed_labels=(
            enhancement
            bug
            documentation
            style
            refactor
            performance
            tests
            maintenance
            ci
            build
          )

          conventional_title_regex='^([A-Za-z]+)(\([^)]*\))?(!)?:[[:space:]]+'

          if [[ "$PR_TITLE" =~ $conventional_title_regex ]]; then
            title_type="${BASH_REMATCH[1],,}"
          else
            echo "No Conventional Commit type found in PR title: $PR_TITLE"
            exit 0
          fi

          case "$title_type" in
            feat)
              target_label="enhancement"
              label_color="a2eeef"
              label_description="New functionality or improvement"
              ;;
            fix)
              target_label="bug"
              label_color="d73a4a"
              label_description="Something is not working correctly"
              ;;
            docs)
              target_label="documentation"
              label_color="0075ca"
              label_description="Documentation changes"
              ;;
            style)
              target_label="style"
              label_color="ededed"
              label_description="Formatting or style-only changes"
              ;;
            refactor)
              target_label="refactor"
              label_color="c5def5"
              label_description="Internal restructuring without behavior changes"
              ;;
            perf)
              target_label="performance"
              label_color="5319e7"
              label_description="Measured performance improvement"
              ;;
            test)
              target_label="tests"
              label_color="bfdadc"
              label_description="Test coverage or test infrastructure"
              ;;
            chore)
              target_label="maintenance"
              label_color="fef2c0"
              label_description="Repository maintenance"
              ;;
            ci)
              target_label="ci"
              label_color="1d76db"
              label_description="Continuous integration changes"
              ;;
            build)
              target_label="build"
              label_color="d4c5f9"
              label_description="Build system or dependency changes"
              ;;
            *)
              echo "Unsupported Conventional Commit type: $title_type"
              exit 0
              ;;
          esac

          current_labels="$(
            gh api \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              --jq '.[].name'
          )"

          for label in "${managed_labels[@]}"; do
            if [[ "$label" != "$target_label" ]] &&
               grep -Fxq "$label" <<< "$current_labels"; then
              gh api \
                --method DELETE \
                "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label"
            fi
          done

          gh label create "$target_label" \
            --repo "$GH_REPO" \
            --color "$label_color" \
            --description "$label_description" \
            --force

          if ! grep -Fxq "$target_label" <<< "$current_labels"; then
            gh api \
              --method POST \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              -f "labels[]=$target_label"
          fi

          echo "PR title type: $title_type"
          echo "Applied label: $target_label"
      - name: Apply area and security labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          current_labels="$(
            gh api \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              --jq '.[].name'
          )"

          changed_files="$(
            gh api \
              --paginate \
              "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
              --jq '.[].filename'
          )"

          has_label() {
            grep -Fxq "$1" <<< "$current_labels"
          }

          ensure_label() {
            local label="$1"
            local color="$2"
            local description="$3"

            gh label create "$label" \
              --repo "$GH_REPO" \
              --color "$color" \
              --description "$description" \
              --force
          }

          add_label() {
            local label="$1"
            local color="$2"
            local description="$3"

            ensure_label "$label" "$color" "$description"

            if ! has_label "$label"; then
              gh api \
                --method POST \
                "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
                -f "labels[]=$label"

              current_labels+=$'\n'"$label"
            fi
          }

          remove_label() {
            local label="$1"

            if has_label "$label"; then
              gh api \
                --method DELETE \
                "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label"

              current_labels="$(
                grep -Fxv "$label" <<< "$current_labels" || true
              )"
            fi
          }

          # Area labels are fully managed from the PR's current changed files.
          managed_area_labels=(
            "area:backend"
            "area:sdk"
            "area:embedded"
            "area:frontend"
            "area:ops"
            "area:ci"
            "area:docs"
            "area:docker"
          )

          for label in "${managed_area_labels[@]}"; do
            remove_label "$label"
          done

          if grep -Eq '^apps/server/' <<< "$changed_files"; then
            add_label \
              "area:backend" \
              "0E8A16" \
              "Changes affecting the backend"
          fi

          if grep -Eq '^packages/client/' <<< "$changed_files"; then
            add_label \
              "area:sdk" \
              "8250DF" \
              "Changes affecting the public SDK"
          fi

          if grep -Eq '^packages/cache/' <<< "$changed_files"; then
            add_label \
              "area:embedded" \
              "008B8B" \
              "Changes affecting the embedded semantic cache"
          fi

          if grep -Eq '^apps/web/' <<< "$changed_files"; then
            add_label \
              "area:frontend" \
              "E99695" \
              "Changes affecting the frontend"
          fi

          if grep -Eq '^ops/' <<< "$changed_files"; then
            add_label \
              "area:ops" \
              "D93F0B" \
              "Changes affecting operational tooling"
          fi

          if grep -Eq '^\.github/' <<< "$changed_files"; then
            add_label \
              "area:ci" \
              "FBCA04" \
              "Changes affecting GitHub or CI automation"
          fi

          if grep -Eq '(^docs/|(^|/)README([^/]*)\.md$)' <<< "$changed_files"; then
            add_label \
              "area:docs" \
              "0075CA" \
              "Changes affecting documentation"
          fi

          if grep -Eq '(^|/)(Dockerfile([^/]*)|(docker-)?compose[^/]*\.ya?ml)$' <<< "$changed_files"; then
            add_label \
              "area:docker" \
              "2496ED" \
              "Changes affecting Docker images or Compose configuration"
          fi

          # Dependabot already manages dependency/ecosystem labels.
          # Add "security" only when the PR contains a strong advisory signal.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]] &&
             printf '%s\n' "$PR_BODY" |
               grep -Eiq \
                 'GHSA-[[:alnum:]-]+|CVE-[0-9]{4}-[0-9]{4,}|Fixed the following security issues'; then

            add_label \
              "security" \
              "b60205" \
              "Security-related fixes, hardening, or dependency updates"

            echo "Detected security advisory content in Dependabot PR."
          elif [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            remove_label "security"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"
