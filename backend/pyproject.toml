[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "asyncpg>=0.31,<0.32",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "numpy>=2.4.6,<2.5",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "python-dotenv>=1.2.3,<2",
  "slowapi>=0.1.10,<1",
  "symspellpy>=6.10.0,<7",
  "tenacity>=9.1.4,<10",
  "uvicorn[standard]>=0.52.1,<1",
]

[project.optional-dependencies]
dev = [
  "asyncpg-stubs>=0.31.3,<0.32",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.4,<0.17",
]

[tool.uv]
required-version = "==0.11.32"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
"app.cache.infrastructure.migrations" = ["*.sql"]
"app.benchmark.infrastructure.migrations" = ["*.sql"]

[tool.ruff]
cache-dir = ".cache/ruff"
extend-exclude = [".cache"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
markers = [
  "pgvector: requires a PostgreSQL database with the pgvector extension",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*", "symspellpy", "symspellpy.*"]
ignore_missing_imports = true
